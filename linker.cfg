MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, define = yes;
    RAM:  start = $0100, size = $0700, type = rw, define = yes;
    PRG:  start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:  start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, define = yes;
    HEADER:   load = PRG, type = ro, start = $8000;
    CODE:     load = PRG, type = ro, start = $8003;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
    CHARS:    load = CHR, type = ro, start = $0000;
}

FEATURES {
    CONDES: segment = RODATA,
            type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__;
}

SYMBOLS {
    __STACKSTART__ = $01FF;
}
